# dsh-unknownue-plugins bundle patch: the personal aggregation layer.
#
# One row per feature, each `name` pointing at a subpath export of this very
# package (same mechanism as the official `dsh-tool-subagent-control/list-agents`
# subpath row). Installing this ONE bundle pulls in and mounts every feature.
#
# Install: dsh plugin --profile web add github:unknownue/dsh-unknownue-plugins
- insert:
    # ──────────────────────────────────────────────────────────────────────
    # Feature #1: Makefile target discovery (display-only; host API + browser UI).
    # ──────────────────────────────────────────────────────────────────────
    - id: dsh-unknownue-plugins
      name: 'dsh-unknownue-plugins'
      config:
        makefile: Makefile

# ──────────────────────────────────────────────────────────────────────────
# Feature #2: SSH remote workspaces (via dsh-workspace-enhancement).
# Provides: ctx.ssh / ctx.subprocess / ctx.fs transparent remote providers,
# multi-workspace sessions, cross-server execution, machine management.
#
# 注意：disable 行必须是顶层行（按 id 覆盖 base bundle 的同名行），
# 不能放进 - insert: 块 —— insert 是"新增"语义，与 base bundle 已有的
# directory-picker / subprocess / fs-sandbox 行重复 id，导致 loader 崩溃
# (duplicate loader entry id)。见 dsh-workspace-enhancement 的官方写法。
# ──────────────────────────────────────────────────────────────────────────

# Disable default directory picker (SSH client UI takes over)
- id: directory-picker
  name: '@deepseek-ai/dsh-host-directory-picker-auto'
  disabled: true

# Disable local providers (mixed provider handles both local + remote)
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'
  disabled: true

- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  disabled: true

- insert:
    # SSH remote provider (placeholder connection, lazy establishment)
    - id: ssh-remote
      name: dsh-workspace-enhancement
      config:
        host: 127.0.0.1
        port: 22
        username: ssh
        cwd: /tmp

    # Directory picker for local/remote browsing
    - id: directory-picker-ssh
      name: dsh-workspace-enhancement/picker
      config:
        maxEntries: 1000

    # Multi-connection registry + /dsw RPC (persistence, connection management)
    - id: ssh-web-channel
      name: dsh-workspace-enhancement/web
      config:
        maxEntries: 1000

    # ──────────────────────────────────────────────────────────────────────
    # Feature #3: Authenticated gateway for remote DSH access (via dsh-gateway).
    # Password-protected reverse proxy with WebSocket tunneling.
    # Remote sessions work exactly like sitting at the machine.
    # ──────────────────────────────────────────────────────────────────────
    - id: gateway
      name: 'dsh-gateway'
      inject: ['webServer']
      config:
        enabled: true
        listenHost: '0.0.0.0'
        port: 8642
        # Password: set here, or via $DSH_GATEWAY_PASSWORD, or ~/.dsh-gateway/secret
        # password: 'your-password-here'
