# dsh-unknownue-plugins bundle patch: the personal aggregation layer.
#
# One row per feature, each `name` pointing at a subpath export of this very
# package (same mechanism as the official `dsh-tool-subagent-control/list-agents`
# subpath row). Installing this ONE bundle pulls in and mounts every feature.
#
# Install: dsh plugin --profile web add github:unknownue/dsh-unknownue-plugins
- insert:
    # ──────────────────────────────────────────────────────────────────────
    # Feature #1: Makefile target discovery (display-only; host API + browser UI).
    # ──────────────────────────────────────────────────────────────────────
    - id: dsh-unknownue-plugins
      name: 'dsh-unknownue-plugins'
      config:
        makefile: Makefile
        explorer:
          maxListEntries: 1000
          maxReadBytes: 1048576
          maxRawBytes: 8388608
          structuralGraceMs: 8000
          stderrTailBytes: 8192

- insert:
    # ──────────────────────────────────────────────────────────────────────
    # Feature #7: paperspace — in-process academic paper reader.
    # PGlite (WASM PostgreSQL) + local filesystem object store; no Docker,
    # no MinIO. MUST be configured before use: the user saves storage
    # locations via DSH Settings → 论文阅读 or the tab's setup screen,
    # persisted to <dsh home>/paperspace/settings.json. The row config below
    # only seeds the settings form's initial values.
    # ──────────────────────────────────────────────────────────────────────
    - id: paperspace
      name: 'dsh-unknownue-plugins/paperspace'
      config:
        dataDir: ''            # empty → ~/.dsh/paperspace/db
        assetsDir: ''          # empty → ~/.dsh/paperspace/assets
        workspaceDir: ''       # empty → sibling of dataDir; holds papers/*.md
        port: 0                # 0 → OS-assigned loopback pgwire port
        initialMemoryBytes: 536870912
        pollMs: 5000
        ingestTimeoutMs: 30000
        maxAssetBytes: 10485760
        ingestConcurrency: 2
        translateMaxAttempts: 3
        translateStuckAfterMinutes: 30
        translateTimeoutMs: 120000
        rescanIntervalMs: 60000

- insert:
    # ──────────────────────────────────────────────────────────────────────
    # Feature #9: tasks — personal task board (kanban + list), user-maintained.
    # In-process PGlite database at a configurable location (default
    # <dsh home>/tasks/db); NO agent surface (no model tools, no session
    # events, no dispatch). The board auto-boots with defaults — the database
    # directory is user-tunable in Settings → 任务面板 and persisted to
    # <dsh home>/tasks/settings.json (path changes take effect on restart).
    # ──────────────────────────────────────────────────────────────────────
    - id: tasks
      name: 'dsh-unknownue-plugins/tasks'
      config:
        dataDir: ''            # empty → <dsh home>/tasks/db
        initialMemoryBytes: 134217728

